        function renderPaperButton(paperKey, buttonText, iconName, isPrimary = false) {
            const link = paperLinks[paperKey];
            if (!link || link === "#" || link.trim() === "" || link.includes("YOUR_")) {
                return ''; 
            }

            let btnClasses = "w-full py-2.5 px-3 bg-slate-800/90 hover:bg-slate-700 hover:border-cyan-500/40 text-slate-200 font-medium text-xs rounded-xl border border-slate-700/80 transition-all flex items-center justify-center gap-1.5 active:scale-[0.98]";
            
            if (isPrimary === 'teal') {
                btnClasses = "w-full py-2.5 px-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-xs rounded-xl shadow-md shadow-teal-500/20 transition-all flex items-center justify-center gap-1.5 active:scale-[0.98]";
            } else if (isPrimary === 'grid') {
                btnClasses = "py-2.5 px-3 bg-teal-600/80 hover:bg-teal-500 text-white font-medium text-xs rounded-xl shadow-md shadow-teal-900/30 transition-all flex items-center justify-center gap-1.5 active:scale-[0.98] border border-teal-500/30";
            }

            return `
                <button onclick="downloadPaper('${paperKey}')" class="${btnClasses}">
                    <i data-lucide="${iconName}" class="w-3.5 h-3.5"></i> ${buttonText}
                </button>
            `;
        }

                { key: 'Southern Province', label: 'Southern Province' },

                { key: 'Eastern Province', label: 'Eastern Province' },
                { key: 'Northern Province', label: 'Northern Province' },
                { key: 'Uva Province', label: 'Uva Province' },
                { key: 'Balangoda Education Zonal', label: 'Balangoda Education Zonal' },
                { key: 'Dehiowita Education Zonal', label: 'Dehiowita Education Zonal' },
                { key: 'Gampaha Education Zone', label: 'Gampaha Education Zone' },
                { key: 'Kelaniya Education Zone', label: 'Kelaniya Education Zone' },
                { key: 'Negombo Education Zone', label: 'Negombo Education Zone' },
                { key: 'Piliyandala Educational Zone', label: 'Piliyandala Educational Zone' },
                { key: 'Sri Jayawardanapura Education Zone', label: 'Sri Jayawardanapura Education Zone' },
                { key: 'Sri Lanka', label: 'Sri Lanka' },
                { key: 'Mathugama Zone', label: 'Mathugama Education Zone' }
            ] : [
                { key: 'Ananda College', label: 'Ananda College | Colombo' },
                { key: 'Anula Vidyalaya Nugegoda', label: 'Anula Vidyalaya | Nugegoda' },
                { key: 'Badulla Central College', label: 'Badulla Central College' },
                { key: 'Bandaranayake College Gampaha', label: 'Bandaranayake College | Gampaha' },
                { key: 'Devi Balika College', label: 'Devi Balika College | Colombo' },
                { key: 'Dharmapala Vidyalaya Pannipitiya', label: 'Dharmapala Vidyalaya | Pannipitiya' },
                { key: 'D.S. Senanayake College', label: 'D.S. Senanayake College | Colombo' },
                { key: 'Ferguson High School Ratnapura', label: 'Ferguson High School | Ratnapura' },
                { key: 'Jaffna Hindu College', label: 'Jaffna Hindu College' },
                { key: 'Mahamaya Girls College Kandy', label: 'Mahamaya Girls College | Kandy' },
                { key: 'Mahanama College', label: 'Mahanama College | Colombo' },
                { key: 'Mahinda Rajapaksha College Homagama', label: 'Mahinda Rajapaksha College | Homagama' },
                { key: 'Monaragala Royal College', label: 'Monaragala Royal College' },
                { key: 'Nalanda College', label: 'Nalanda College | Colombo' },
                { key: 'Pinnawala Central College', label: 'Pinnawala Central College' },
                { key: 'Rathnavali Balika Vidyalaya', label: 'Rathnavali Balika Vidyalaya | Gampaha' },
                { key: 'Richmond College Galle', label: 'Richmond College | Galle' },
                { key: 'Royal Central College Polonnaruwa', label: 'Royal Central College | Polonnaruwa' },
                { key: 'Royal College Colombo', label: 'Royal College | Colombo 07' },
                { key: 'Royal College', label: 'Royal College | Colombo' },
                { key: 'Seethawaka National School Avissawella', label: 'Seethawaka National School' },
                { key: 'Sirimavo Bandaranaike Vidyalaya', label: 'Sirimavo Bandaranaike Vidyalaya | Colombo' },
                { key: 'Sivali Central College', label: 'Sivali Central College | Ratnapura' },
                { key: 'Sripalee National School Horana', label: 'Sripalee National School | Horana' },
                { key: 'Taxila Central College Horana', label: 'Taxila Central College | Horana' },
                { key: 'Visakha Vidyalaya', label: 'Visakha Vidyalaya | Colombo 05' },
                { key: 'St. Peters College Colombo 04', label: "St. Peter's College | Colombo 04" },
                { key: 'De Mazenod College', label: 'De Mazenod College' },
                { key: 'Vidyarathna University College', label: 'Vidyarathna University College' },
                { key: 'Mathugama Zone', label: 'Mathugama Education Zone' },
                { key: 'North Western Province', label: 'North Western Province' }
            ];

            const renderedKeys = new Set();

            if (gradeLevel) {
                knownEntities.forEach(ent => {
                    const fullKey = `${selectedYr}_${subjectName}_${gradeLevel}_${categoryType}_${termName}_${ent.key}`;
                    if (paperLinks[fullKey]) {
                        buttonsHTML += renderPaperButton(fullKey, ent.label, 'download');
                        renderedKeys.add(fullKey);
                    }
                });

                const prefix = `${selectedYr}_${subjectName}_${gradeLevel}_${categoryType}_${termName}_`;
                Object.keys(paperLinks).forEach(pk => {
                    if (pk.startsWith(prefix) && !renderedKeys.has(pk)) {
                        const customName = pk.substring(prefix.length);
                        buttonsHTML += renderPaperButton(pk, customName, 'download');
                        renderedKeys.add(pk);
                    }
                });
            }

            if (gradeLevel === 'Grade 11' && !buttonsHTML.trim()) {
                knownEntities.forEach(ent => {
                    const legacyKey = `${selectedYr}_${subjectName}_${categoryType}_${termName}_${ent.key}`;
                    if (paperLinks[legacyKey]) {
                        buttonsHTML += renderPaperButton(legacyKey, ent.label, 'download');
                        renderedKeys.add(legacyKey);
                    }
                });

                const legacyPrefix = `${selectedYr}_${subjectName}_${categoryType}_${termName}_`;
                Object.keys(paperLinks).forEach(pk => {
                    if (pk.startsWith(legacyPrefix) && !pk.includes('_Grade ') && !renderedKeys.has(pk)) {
                        const customName = pk.substring(legacyPrefix.length);
                        buttonsHTML += renderPaperButton(pk, customName, 'download');
                        renderedKeys.add(pk);
                    }
                });
            }

            if (!buttonsHTML.trim()) {
                return '';
            }

            return `
                <div class="space-y-1.5 pl-2 border-l-2 border-cyan-500/30 my-2">
                    <h4 class="text-[11px] font-bold text-cyan-300 uppercase tracking-wide">${termName}</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${buttonsHTML}
                    </div>
                </div>
            `;
        }

        function renderScreen() {
            const container = document.getElementById('card-content');
            const cardElem = document.getElementById('app-card');
            
            cardElem.classList.remove('card-animation');
            void cardElem.offsetWidth; 
            cardElem.classList.add('card-animation');

            const currentStep = stateHistory[stateHistory.length - 1];

            switch(currentStep) {
                case 'HOME':
                    container.innerHTML = renderHome();
                    break;
                case 'AL_STREAMS':
                    container.innerHTML = renderALStreams();
                    break;
                case 'JR_SUBJECTS':
                    container.innerHTML = renderGradeSubjects('JR');
                    break;
                case 'PR_SUBJECTS':
                    container.innerHTML = renderGradeSubjects('PR');
                    break;
                case 'OL_SUBJECTS':
                    container.innerHTML = renderOLSubjects();
                    break;
                case 'AL_SUBJECTS':
                    container.innerHTML = renderALSubjects();
                    break;
                case 'YEAR_SELECTION':
                    container.innerHTML = renderYearSelection();
                    break;
                case 'PAPER_DETAILS':
                    container.innerHTML = renderPaperDetails();
                    break;
                default:
                    container.innerHTML = renderHome();
            }

            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function selectExamLevel(level) {
            if (level === 'JR' || level === 'PR') {
                currentStateData.exam = level;
                navigateTo(level + '_SUBJECTS');
                return;
            }
            currentStateData.exam = level;
            if (level === 'AL') {
                navigateTo('AL_STREAMS');
            } else {
                navigateTo('OL_SUBJECTS');
            }
        }

                const provincialHTML = prov1st + prov2nd + prov3rd;

                const school1st = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'School', '1st Term');

                const schoolHTML = school1st + school2nd + school3rd;

        let historyDepth = 0;

        function syncBrowserHistoryState(pushNew = true) {
            if (!window.history) return;
            const snapshot = {
                stateHistory: [...stateHistory],
                currentStateData: { ...currentStateData }
            };
            try {
                if (pushNew) {
                    window.history.pushState(snapshot, '');
                    historyDepth++;
                } else {
                    window.history.replaceState(snapshot, '');
                }
            } catch (e) {}
        }

        window.addEventListener('popstate', function(event) {
            if (event.state && Array.isArray(event.state.stateHistory) && event.state.stateHistory.length > 0) {
                stateHistory = [...event.state.stateHistory];
                if (event.state.currentStateData) {
                    currentStateData = { ...currentStateData, ...event.state.currentStateData };
                }
                historyDepth = Math.max(0, stateHistory.length - 1);
                renderScreen();
            } else if (stateHistory.length > 1) {
                stateHistory.pop();
                historyDepth = Math.max(0, historyDepth - 1);
                renderScreen();
            }
        });

        function navigateTo(step) {
            stateHistory.push(step);
            syncBrowserHistoryState(true);
            renderScreen();
        }

        function goBack() {
            if (stateHistory.length > 1) {
                if (historyDepth > 0 && window.history && typeof window.history.back === 'function') {
                    window.history.back();
                } else {
                    stateHistory.pop();
                    renderScreen();
                }
            }
        }

        function goHome() {
            stateHistory = ['HOME'];
            currentStateData = { exam: null, stream: null, streamTitle: '', subject: null, selectedYear: null, alTab: 'GRADE_12', olTab: 'GRADE_11', jrTab: 'GRADE_6', prTab: 'GRADE_1' };
            syncBrowserHistoryState(true);
            renderScreen();

        // ========================================================================
        const INITIAL_VISITS = 1200;

            jrViews: INITIAL_JR_VIEWS,
            prViews: INITIAL_PR_VIEWS
        };

        // Shared (global) counters stored on Abacus counter service so every
        // browser/device sees the same numbers. Displayed = INITIAL + shared value.
        const COUNTER_API = 'https://abacus.jasoncameron.dev';
        const COUNTER_NS = 'paperlk-com-ngp6';
        const COUNTER_KEYS = {
            visits: 'website-visits',
            olViews: 'ol-paper-views',
            alViews: 'al-paper-views',
            jrViews: 'jr-paper-views',
            prViews: 'pr-paper-views'
        };
        const COUNTER_INITIALS = {
            visits: INITIAL_VISITS,
            olViews: INITIAL_OL_VIEWS,
            alViews: INITIAL_AL_VIEWS,
            jrViews: INITIAL_JR_VIEWS,
            prViews: INITIAL_PR_VIEWS
        };

        async function counterRequest(action, field) {
            try {
                const res = await fetch(COUNTER_API + '/' + action + '/' + COUNTER_NS + '/' + COUNTER_KEYS[field]);
                if (res.status === 404) return 0; // key not created yet
                if (!res.ok) return null;
                const data = await res.json();
                return typeof data.value === 'number' ? data.value : null;
            } catch (e) {
                return null;
            }
        }

        async function syncCounter(field, action) {
            const value = await counterRequest(action, field);
            if (value !== null) {
                statsCounters[field] = COUNTER_INITIALS[field] + value;
                updateCountersDisplay();
            }
        }

        function loadAndIncrementVisitCounter() {
            updateCountersDisplay();
            // Count a visit once per browser session (refreshes don't inflate it)
            let alreadyCounted = false;
            try { alreadyCounted = sessionStorage.getItem('ngp6_visit_counted') === '1'; } catch (e) {}
            syncCounter('visits', alreadyCounted ? 'get' : 'hit');
            if (!alreadyCounted) {
                try { sessionStorage.setItem('ngp6_visit_counted', '1'); } catch (e) {}
            }
            syncCounter('olViews', 'get');
            syncCounter('alViews', 'get');
            syncCounter('jrViews', 'get');
            syncCounter('prViews', 'get');
        }

        function incrementPaperViewCounter(examType) {
            let field = 'alViews';
            if (examType === 'OL') field = 'olViews';
            else if (examType === 'JR') field = 'jrViews';

            statsCounters[field] += 1; // instant feedback

        // ========================================================================
        // ✨ PAPERS HUB ANIMATED BACKGROUND (PARTICLES, CONSTELLATIONS & MINI PAPERS)
        // ========================================================================
        let papersBgAnimId = null;

        function initPapersHubBackground() {
            const canvas = document.getElementById('papers-bg-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            const mouse = { x: null, y: null, radius: 130 };

            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener('mouseout', () => {
                mouse.x = null;
                mouse.y = null;
            });

            const symbols = ['A+', '∑', 'π', '∫', '√x', 'Δ', 'Ω', 'MCQ', 'A/L', 'O/L', 'E=mc²', 'f(x)', '✓'];
            const colors = [
                'rgba(6, 182, 212, ',   // cyan-500
                'rgba(59, 130, 246, ',  // blue-500
                'rgba(20, 184, 166, ',  // teal-500
                'rgba(99, 102, 241, '   // indigo-500
            ];

            let networkNodes = [];
            let floatingItems = [];

            function createSceneEntities() {
                networkNodes = [];
                floatingItems = [];

                const nodeCount = Math.min(75, Math.max(32, Math.floor((width * height) / 18000)));
                for (let i = 0; i < nodeCount; i++) {
                    networkNodes.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.55,
                        vy: (Math.random() - 0.5) * 0.55,
                        radius: Math.random() * 2 + 1,
                        colorPrefix: colors[Math.floor(Math.random() * colors.length)],
                        alpha: Math.random() * 0.45 + 0.2,
                        pulseSpeed: Math.random() * 0.02 + 0.01,
                        pulsePhase: Math.random() * Math.PI * 2
                    });
                }

                const itemCount = Math.min(26, Math.max(12, Math.floor((width * height) / 48000)));
                for (let i = 0; i < itemCount; i++) {
                    const isPaperSheet = i % 2 === 0;
                    floatingItems.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vy: -(Math.random() * 0.35 + 0.15),
                        vx: (Math.random() - 0.5) * 0.25,
                        swayAmp: Math.random() * 0.4 + 0.1,
                        swaySpeed: Math.random() * 0.015 + 0.005,
                        swayOffset: Math.random() * Math.PI * 2,
                        rotation: (Math.random() - 0.5) * 0.5,
                        rotSpeed: (Math.random() - 0.5) * 0.003,
                        type: isPaperSheet ? 'paper' : 'symbol',
                        symbol: symbols[i % symbols.length],
                        size: isPaperSheet ? (Math.random() * 10 + 18) : (Math.random() * 5 + 11),
                        colorPrefix: colors[i % colors.length],
                        alpha: isPaperSheet ? (Math.random() * 0.16 + 0.08) : (Math.random() * 0.22 + 0.10)
                    });
                }
            }

            createSceneEntities();

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                createSceneEntities();
            });

            function drawMiniPaper(ctx, size, colorPrefix, baseAlpha) {
                const alpha = currentThemeMode === 'light' ? Math.min(0.45, baseAlpha * 1.65) : baseAlpha;
                const w = size;
                const h = size * 1.32;
                const fold = w * 0.28;

                ctx.beginPath();
                ctx.moveTo(-w / 2, -h / 2);
                ctx.lineTo(w / 2 - fold, -h / 2);
                ctx.lineTo(w / 2, -h / 2 + fold);
                ctx.lineTo(w / 2, h / 2);
                ctx.lineTo(-w / 2, h / 2);
                ctx.closePath();

                ctx.fillStyle = colorPrefix + (alpha * 0.25) + ')';
                ctx.fill();
                ctx.lineWidth = 1.1;
                ctx.strokeStyle = colorPrefix + (alpha * 1.4) + ')';
                ctx.stroke();

                // Folded corner
                ctx.beginPath();
                ctx.moveTo(w / 2 - fold, -h / 2);
                ctx.lineTo(w / 2 - fold, -h / 2 + fold);
                ctx.lineTo(w / 2, -h / 2 + fold);
                ctx.strokeStyle = colorPrefix + (alpha * 1.2) + ')';
                ctx.stroke();

                // Miniature text lines inside the paper
                ctx.beginPath();
                for (let lineIdx = 0; lineIdx < 3; lineIdx++) {
                    const ly = -h * 0.12 + lineIdx * (h * 0.2);
                    const lw = lineIdx === 2 ? w * 0.35 : w * 0.55;
                    ctx.moveTo(-w * 0.28, ly);
                    ctx.lineTo(-w * 0.28 + lw, ly);
                }
                ctx.strokeStyle = colorPrefix + (alpha * 1.3) + ')';
                ctx.lineWidth = 0.9;
                ctx.stroke();
            }

            let tick = 0;
            function animate() {
                ctx.clearRect(0, 0, width, height);
                tick++;

                // 1. Update and draw floating mini papers & academic symbols
                for (let i = 0; i < floatingItems.length; i++) {
                    const item = floatingItems[i];
                    item.y += item.vy;
                    item.x += item.vx + Math.sin(tick * item.swaySpeed + item.swayOffset) * item.swayAmp;
                    item.rotation += item.rotSpeed;

                    if (item.y < -50) {
                        item.y = height + 40;
                        item.x = Math.random() * width;
                    }
                    if (item.x < -50) item.x = width + 40;
                    if (item.x > width + 50) item.x = -40;

                    ctx.save();
                    ctx.translate(item.x, item.y);
                    ctx.rotate(item.rotation);

                    if (item.type === 'paper') {
                        drawMiniPaper(ctx, item.size, item.colorPrefix, item.alpha);
                    } else {
                        const symAlpha = currentThemeMode === 'light' ? Math.min(0.45, item.alpha * 1.6) : item.alpha;
                        ctx.font = `600 ${Math.round(item.size)}px 'Inter', sans-serif`;
                        ctx.fillStyle = item.colorPrefix + symAlpha + ')';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(item.symbol, 0, 0);
                    }
                    ctx.restore();
                }

                // 2. Update and draw glowing particle nodes & constellation lines
                for (let i = 0; i < networkNodes.length; i++) {
                    const p = networkNodes[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    // Gentle cursor interaction
                    if (mouse.x !== null && mouse.y !== null) {
                        const dxMouse = p.x - mouse.x;
                        const dyMouse = p.y - mouse.y;
                        const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                        if (distMouse < mouse.radius && distMouse > 0) {
                            const force = (mouse.radius - distMouse) / mouse.radius;
                            p.x += (dxMouse / distMouse) * force * 0.6;
                            p.y += (dyMouse / distMouse) * force * 0.6;
                        }
                    }

                    const currentAlpha = p.alpha + Math.sin(tick * p.pulseSpeed + p.pulsePhase) * 0.12;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.colorPrefix + Math.max(0.1, currentAlpha).toFixed(2) + ')';
                    ctx.fill();

                    // Connect nearby nodes
                    for (let j = i + 1; j < networkNodes.length; j++) {
                        const p2 = networkNodes[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 125;

                        if (dist < maxDist) {
                            const isLight = currentThemeMode === 'light';
                            const lineAlpha = (1 - dist / maxDist) * (isLight ? 0.22 : 0.14);
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = isLight 
                                ? `rgba(2, 132, 199, ${lineAlpha.toFixed(3)})`
                                : `rgba(6, 182, 212, ${lineAlpha.toFixed(3)})`;
                            ctx.lineWidth = 0.85;
                            ctx.stroke();
                        }
                    }
                }

                papersBgAnimId = requestAnimationFrame(animate);
            }

            if (papersBgAnimId) cancelAnimationFrame(papersBgAnimId);
            animate();
        }

        window.onload = function() {
            setThemeMode(currentThemeMode);
            loadAndIncrementVisitCounter();
            syncBrowserHistoryState(false);
            renderScreen();
            initPapersHubBackground();
        };
    </script>
</body>
</html>
