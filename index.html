                { key: 'Mathugama Zone', label: 'Mathugama Education Zone' },
                { key: 'North Western Province', label: 'North Western Province' }
            ];

            const renderedKeys = new Set();

            if (gradeLevel) {
                knownEntities.forEach(ent => {
                    const fullKey = `${selectedYr}_${subjectName}_${gradeLevel}_${categoryType}_${termName}_${ent.key}`;
                    if (paperLinks[fullKey]) {
                        buttonsHTML += renderPaperButton(fullKey, ent.label, 'download');
                        renderedKeys.add(fullKey);
                    }
                });

                const prefix = `${selectedYr}_${subjectName}_${gradeLevel}_${categoryType}_${termName}_`;
                Object.keys(paperLinks).forEach(pk => {
                    if (pk.startsWith(prefix) && !renderedKeys.has(pk)) {
                        const customName = pk.substring(prefix.length);
                        buttonsHTML += renderPaperButton(pk, customName, 'download');
                        renderedKeys.add(pk);
                    }
                });
            }

            if (gradeLevel === 'Grade 11' && !buttonsHTML.trim()) {
                knownEntities.forEach(ent => {
                    const legacyKey = `${selectedYr}_${subjectName}_${categoryType}_${termName}_${ent.key}`;

                        buttonsHTML += renderPaperButton(legacyKey, ent.label, 'download');
                        renderedKeys.add(legacyKey);

                const legacyPrefix = `${selectedYr}_${subjectName}_${categoryType}_${termName}_`;

                        const customName = pk.substring(legacyPrefix.length);
                        buttonsHTML += renderPaperButton(pk, customName, 'download');
                        renderedKeys.add(pk);
                    }
                });
            }

            if (!buttonsHTML.trim()) {

                        ${buttonsHTML}
                    </div>
                </div>
            `;
        }

        function navigateTo(step) {

        function goHome() {
            stateHistory = ['HOME'];

        function selectSubject(subjName, nextStep) {

        function selectYear(yr) {
            currentStateData.selectedYear = yr;
            if (stateHistory[stateHistory.length - 1] !== 'PAPER_DETAILS') {
                navigateTo('PAPER_DETAILS');
            } else {
                renderScreen();
            }
        }

        let currentTargetDownloadLink = '';
        let adCountdownTimer = null;
        let currentActiveAd = null;

        // ========================================================================
        // 📊 COUNTERS MANAGEMENT (STARTING VALUES: VISITS=1200, O/L=750, A/L=500)
        // ========================================================================
        const INITIAL_VISITS = 1200;
        const INITIAL_OL_VIEWS = 750;
        const INITIAL_AL_VIEWS = 500;

        let statsCounters = {
            visits: INITIAL_VISITS,
            olViews: INITIAL_OL_VIEWS,
            alViews: INITIAL_AL_VIEWS
        };

        // Shared (global) counters stored on Abacus counter service so every
        // browser/device sees the same numbers. Displayed = INITIAL + shared value.
        const COUNTER_API = 'https://abacus.jasoncameron.dev';
        const COUNTER_NS = 'paperlk-com-ngp6';
        const COUNTER_KEYS = { visits: 'website-visits', olViews: 'ol-paper-views', alViews: 'al-paper-views' };
        const COUNTER_INITIALS = { visits: INITIAL_VISITS, olViews: INITIAL_OL_VIEWS, alViews: INITIAL_AL_VIEWS };

        async function counterRequest(action, field) {
            try {
                const res = await fetch(COUNTER_API + '/' + action + '/' + COUNTER_NS + '/' + COUNTER_KEYS[field]);
                if (res.status === 404) return 0; // key not created yet
                if (!res.ok) return null;
                const data = await res.json();
                return typeof data.value === 'number' ? data.value : null;
            } catch (e) {
                return null;
            }
        }

        async function syncCounter(field, action) {
            const value = await counterRequest(action, field);
            if (value !== null) {
                statsCounters[field] = COUNTER_INITIALS[field] + value;
                updateCountersDisplay();
            }
        }

        function loadAndIncrementVisitCounter() {
            updateCountersDisplay();
            // Count a visit once per browser session (refreshes don't inflate it)
            let alreadyCounted = false;
            try { alreadyCounted = sessionStorage.getItem('ngp6_visit_counted') === '1'; } catch (e) {}
            syncCounter('visits', alreadyCounted ? 'get' : 'hit');
            if (!alreadyCounted) {
                try { sessionStorage.setItem('ngp6_visit_counted', '1'); } catch (e) {}
            }
            syncCounter('olViews', 'get');
            syncCounter('alViews', 'get');
        }

        function incrementPaperViewCounter(examType) {
            const field = examType === 'OL' ? 'olViews' : 'alViews';
            statsCounters[field] += 1; // instant feedback
            updateCountersDisplay();
            syncCounter(field, 'hit'); // sync with shared total
        }

        function updateCountersDisplay() {
            const visitEl = document.getElementById('counter-website-visits');
            const olEl = document.getElementById('counter-ol-views');
            const alEl = document.getElementById('counter-al-views');

            if (visitEl) visitEl.textContent = String(statsCounters.visits);
            if (olEl) olEl.textContent = String(statsCounters.olViews);
            if (alEl) alEl.textContent = String(statsCounters.alViews);
        }

        function downloadPaper(paperKey) {
            const isOLPaper = currentStateData.exam === 'OL' || olSubjects.some(sub => paperKey.includes(sub.id));
            incrementPaperViewCounter(isOLPaper ? 'OL' : 'AL');

            const link = paperLinks[paperKey];
            if (link && link.trim() !== "" && !link.includes("YOUR_")) {
                currentTargetDownloadLink = link;
                triggerAdvertisementModal();
            } else {
                showToast(`අදාළ Link එක තවම ඇතුළත් කර නැත!`);
            }
        }

        function extractYouTubeID(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function triggerAdvertisementModal() {
            const overlay = document.getElementById('ad-modal-overlay');
            if (!overlay) return;

            // දැනට තෝරාගෙන ඇති විෂය (උදා: Physics, Political Science ආදී වශයෙන්) ලබා ගැනීම
            const currentSubject = currentStateData.subject || 'default';
            
            // අදාළ විෂයට අදාළ දැන්වීම් ලැයිස්තුව ලබා ගැනීම, නැතහොත් 'default' ලැයිස්තුව පෙන්වීම
            let adsList = subjectAdvertisements[currentSubject] || subjectAdvertisements['default'];

            let selectedAd = {
                videoUrl: 'https://www.youtube.com/watch?v=PIrLGBgoz2U',
                youtubeChannelUrl: 'https://www.youtube.com/@NGP6Official',
                whatsappNumber: ''
            };

            if (adsList && adsList.length > 0) {
                const randomIndex = Math.floor(Math.random() * adsList.length);
                selectedAd = adsList[randomIndex];
            }

            currentActiveAd = selectedAd;

            const videoId = extractYouTubeID(selectedAd.videoUrl);
            const isShorts = selectedAd.videoUrl && selectedAd.videoUrl.includes('/shorts/');
            
            let mediaHTML = '';

            if (videoId) {
                const playerContainerClass = isShorts 
                    ? "relative w-full max-w-[240px] mx-auto aspect-[9/16] rounded-xl overflow-hidden bg-black shadow-lg" 
                    : "relative w-full aspect-video rounded-xl overflow-hidden bg-black shadow-lg";

                mediaHTML = `
                    <div class="${playerContainerClass}">
                        <iframe 
                            src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&disablekb=1" 
                            title="Advertisement" 
                            class="w-full h-full border-0 pointer-events-none scale-[1.05]"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                `;
            } else {
                mediaHTML = `
                    <div class="w-full p-8 rounded-xl bg-slate-800/80 border border-slate-700/60 text-center">
                        <i data-lucide="sparkles" class="w-10 h-10 text-cyan-400 mx-auto mb-3 animate-pulse"></i>
                        <p class="text-sm font-semibold text-slate-200">NGP6 Official Sponsor Announcement</p>
                        <p class="text-xs text-slate-400 mt-1">ඔබගේ Download Link එක සුදානම් වෙමින් පවතී...</p>
                    </div>
                `;
            }

            let whatsappButtonHTML = '';
            if (selectedAd.whatsappNumber && selectedAd.whatsappNumber.trim() !== '') {
                whatsappButtonHTML = `
                    <a href="https://wa.me/${selectedAd.whatsappNumber}" target="_blank" 
                        class="py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-xl shadow-md shadow-emerald-900/30 transition-all flex items-center justify-center gap-1.5 active:scale-95 border border-emerald-500/30">
                        <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp
                    </a>
                `;
            }

            let youtubeButtonHTML = '';
            if (selectedAd.youtubeChannelUrl && selectedAd.youtubeChannelUrl.trim() !== '') {
                youtubeButtonHTML = `
                    <a href="${selectedAd.youtubeChannelUrl}" target="_blank" 
                        class="py-2.5 px-4 bg-red-600 hover:bg-red-500 text-white font-semibold text-xs rounded-xl shadow-md shadow-red-900/30 transition-all flex items-center justify-center gap-1.5 active:scale-95 border border-red-500/30 flex-1">
                        <i data-lucide="youtube" class="w-4 h-4"></i> YouTube Channel
                    </a>
                `;
            }

            overlay.innerHTML = `
                <div class="ad-modal-anim w-full max-w-md bg-slate-900 border border-cyan-500/30 rounded-2xl p-4 sm:p-5 shadow-2xl flex flex-col gap-3 relative">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-[10px] font-bold uppercase tracking-wider">Ad</span>
                            <span class="text-xs font-semibold text-slate-300">Sponsor Advertisement</span>
                        </div>
                        <span id="ad-timer-text" class="text-xs text-slate-400 font-medium">Skip in <b id="ad-countdown" class="text-cyan-400">5</b>s</span>
                    </div>

                    ${mediaHTML}

                    <div class="space-y-2 pt-1 border-t border-slate-800/80">
                        <p class="text-[11px] font-medium text-slate-400 text-center">මේ පිලිබඳ වැඩිදුර තොරතුරු සහ විමසීම් සඳහා,</p>
                        <div class="flex items-center gap-2">
                            ${youtubeButtonHTML}
                            ${whatsappButtonHTML}
                        </div>
                    </div>

                    <div class="pt-1 flex items-center justify-end border-t border-slate-800/80">
                        <button id="skip-ad-btn" disabled onclick="skipAdAndDownload()" 
                            class="py-2 px-4 bg-slate-800 text-slate-500 font-semibold text-xs rounded-xl border border-slate-700 cursor-not-allowed transition-all flex items-center gap-2">
                            <span>Skip Ad</span>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;

            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            if (window.lucide) lucide.createIcons();

            let timeLeft = 5;
            if (adCountdownTimer) clearInterval(adCountdownTimer);

            adCountdownTimer = setInterval(() => {
                timeLeft--;
                const countdownElem = document.getElementById('ad-countdown');
                if (countdownElem) countdownElem.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(adCountdownTimer);
                    const skipBtn = document.getElementById('skip-ad-btn');
                    const timerText = document.getElementById('ad-timer-text');
                    
                    if (skipBtn) {
                        skipBtn.disabled = false;
                        skipBtn.className = "py-2 px-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/25 cursor-pointer transition-all flex items-center gap-2 active:scale-95 animate-bounce";
                    }
                    if (timerText) {
                        timerText.innerHTML = `<span class="text-cyan-400 font-semibold">You can skip now</span>`;
                    }
                }
            }, 1000);
        }

        function skipAdAndDownload() {
            const overlay = document.getElementById('ad-modal-overlay');
            if (overlay) {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                overlay.innerHTML = ``;
            }

            if (adCountdownTimer) clearInterval(adCountdownTimer);

            if (currentTargetDownloadLink) {
                window.open(currentTargetDownloadLink, '_blank');
                currentTargetDownloadLink = '';
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-cyan-500/40 text-slate-100 text-xs sm:text-sm py-3 px-5 rounded-2xl shadow-2xl shadow-cyan-950/80 z-50 transition-all duration-300 transform opacity-0 translate-y-3 flex items-center gap-2.5 backdrop-blur-md';
            toast.innerHTML = `<i data-lucide="info" class="w-4 h-4 text-cyan-400"></i> <span class="font-medium">${message}</span>`;
            
            document.body.appendChild(toast);
            if (window.lucide) lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-3');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-3');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }


        // ========================================================================
        // 🌗 THEME MODE MANAGEMENT (DEFAULT: DARK MODE)
        // ========================================================================
        let currentThemeMode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';

        function setThemeMode(mode) {
            currentThemeMode = mode === 'light' ? 'light' : 'dark';
            const htmlEl = document.documentElement;
            const bodyEl = document.body;
            const darkBtn = document.getElementById('theme-dark-btn');
            const lightBtn = document.getElementById('theme-light-btn');

            if (currentThemeMode === 'dark') {
                htmlEl.classList.add('dark');
                htmlEl.style.backgroundColor = '#060913';
                if (bodyEl) bodyEl.style.backgroundColor = '#060913';
                if (darkBtn) {
                    darkBtn.className = "flex items-center justify-center w-6 h-6 rounded-full transition-all bg-cyan-500 text-slate-950 shadow-sm";
                }
                if (lightBtn) {
                    lightBtn.className = "flex items-center justify-center w-6 h-6 rounded-full transition-all text-slate-400 hover:text-slate-200";
                }
            } else {
                htmlEl.classList.remove('dark');
                htmlEl.style.backgroundColor = '#f8fafc';
                if (bodyEl) bodyEl.style.backgroundColor = '#f8fafc';
                if (lightBtn) {
                    lightBtn.className = "flex items-center justify-center w-6 h-6 rounded-full transition-all bg-sky-500 text-white shadow-sm";
                }
                if (darkBtn) {
                    darkBtn.className = "flex items-center justify-center w-6 h-6 rounded-full transition-all text-slate-500 hover:text-slate-900";
                }
            }
        }

        // ========================================================================
        // ✨ PAPERS HUB ANIMATED BACKGROUND (PARTICLES, CONSTELLATIONS & MINI PAPERS)
        // ========================================================================
        let papersBgAnimId = null;

        function initPapersHubBackground() {
            const canvas = document.getElementById('papers-bg-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            const mouse = { x: null, y: null, radius: 130 };

            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener('mouseout', () => {
                mouse.x = null;
                mouse.y = null;
            });

            const symbols = ['A+', '∑', 'π', '∫', '√x', 'Δ', 'Ω', 'MCQ', 'A/L', 'O/L', 'E=mc²', 'f(x)', '✓'];
            const colors = [
                'rgba(6, 182, 212, ',   // cyan-500
                'rgba(59, 130, 246, ',  // blue-500
                'rgba(20, 184, 166, ',  // teal-500
                'rgba(99, 102, 241, '   // indigo-500
            ];

            let networkNodes = [];
            let floatingItems = [];

            function createSceneEntities() {
                networkNodes = [];
                floatingItems = [];

                const nodeCount = Math.min(75, Math.max(32, Math.floor((width * height) / 18000)));
                for (let i = 0; i < nodeCount; i++) {
                    networkNodes.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.55,
                        vy: (Math.random() - 0.5) * 0.55,
                        radius: Math.random() * 2 + 1,
                        colorPrefix: colors[Math.floor(Math.random() * colors.length)],
                        alpha: Math.random() * 0.45 + 0.2,
                        pulseSpeed: Math.random() * 0.02 + 0.01,
                        pulsePhase: Math.random() * Math.PI * 2
                    });
                }

                const itemCount = Math.min(26, Math.max(12, Math.floor((width * height) / 48000)));
                for (let i = 0; i < itemCount; i++) {
                    const isPaperSheet = i % 2 === 0;
                    floatingItems.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vy: -(Math.random() * 0.35 + 0.15),
                        vx: (Math.random() - 0.5) * 0.25,
                        swayAmp: Math.random() * 0.4 + 0.1,
                        swaySpeed: Math.random() * 0.015 + 0.005,
                        swayOffset: Math.random() * Math.PI * 2,
                        rotation: (Math.random() - 0.5) * 0.5,
                        rotSpeed: (Math.random() - 0.5) * 0.003,
                        type: isPaperSheet ? 'paper' : 'symbol',
                        symbol: symbols[i % symbols.length],
                        size: isPaperSheet ? (Math.random() * 10 + 18) : (Math.random() * 5 + 11),
                        colorPrefix: colors[i % colors.length],
                        alpha: isPaperSheet ? (Math.random() * 0.16 + 0.08) : (Math.random() * 0.22 + 0.10)
                    });
                }
            }

            createSceneEntities();

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                createSceneEntities();
            });

            function drawMiniPaper(ctx, size, colorPrefix, baseAlpha) {
                const alpha = currentThemeMode === 'light' ? Math.min(0.45, baseAlpha * 1.65) : baseAlpha;
                const w = size;
                const h = size * 1.32;
                const fold = w * 0.28;

                ctx.beginPath();
                ctx.moveTo(-w / 2, -h / 2);
                ctx.lineTo(w / 2 - fold, -h / 2);
                ctx.lineTo(w / 2, -h / 2 + fold);
                ctx.lineTo(w / 2, h / 2);
                ctx.lineTo(-w / 2, h / 2);
                ctx.closePath();

                ctx.fillStyle = colorPrefix + (alpha * 0.25) + ')';
                ctx.fill();
                ctx.lineWidth = 1.1;
                ctx.strokeStyle = colorPrefix + (alpha * 1.4) + ')';
                ctx.stroke();

                // Folded corner
                ctx.beginPath();
                ctx.moveTo(w / 2 - fold, -h / 2);
                ctx.lineTo(w / 2 - fold, -h / 2 + fold);
                ctx.lineTo(w / 2, -h / 2 + fold);
                ctx.strokeStyle = colorPrefix + (alpha * 1.2) + ')';
                ctx.stroke();

                // Miniature text lines inside the paper
                ctx.beginPath();
                for (let lineIdx = 0; lineIdx < 3; lineIdx++) {
                    const ly = -h * 0.12 + lineIdx * (h * 0.2);
                    const lw = lineIdx === 2 ? w * 0.35 : w * 0.55;
                    ctx.moveTo(-w * 0.28, ly);
                    ctx.lineTo(-w * 0.28 + lw, ly);
                }
                ctx.strokeStyle = colorPrefix + (alpha * 1.3) + ')';
                ctx.lineWidth = 0.9;
                ctx.stroke();
            }

            let tick = 0;
            function animate() {
                ctx.clearRect(0, 0, width, height);
                tick++;

                // 1. Update and draw floating mini papers & academic symbols
                for (let i = 0; i < floatingItems.length; i++) {
                    const item = floatingItems[i];
                    item.y += item.vy;
                    item.x += item.vx + Math.sin(tick * item.swaySpeed + item.swayOffset) * item.swayAmp;
                    item.rotation += item.rotSpeed;

                    if (item.y < -50) {
                        item.y = height + 40;
                        item.x = Math.random() * width;
                    }
                    if (item.x < -50) item.x = width + 40;
                    if (item.x > width + 50) item.x = -40;

                    ctx.save();
                    ctx.translate(item.x, item.y);
                    ctx.rotate(item.rotation);

                    if (item.type === 'paper') {
                        drawMiniPaper(ctx, item.size, item.colorPrefix, item.alpha);
                    } else {
                        const symAlpha = currentThemeMode === 'light' ? Math.min(0.45, item.alpha * 1.6) : item.alpha;
                        ctx.font = `600 ${Math.round(item.size)}px 'Inter', sans-serif`;
                        ctx.fillStyle = item.colorPrefix + symAlpha + ')';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(item.symbol, 0, 0);
                    }
                    ctx.restore();
                }

                // 2. Update and draw glowing particle nodes & constellation lines
                for (let i = 0; i < networkNodes.length; i++) {
                    const p = networkNodes[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    // Gentle cursor interaction
                    if (mouse.x !== null && mouse.y !== null) {
                        const dxMouse = p.x - mouse.x;
                        const dyMouse = p.y - mouse.y;
                        const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                        if (distMouse < mouse.radius && distMouse > 0) {
                            const force = (mouse.radius - distMouse) / mouse.radius;
                            p.x += (dxMouse / distMouse) * force * 0.6;
                            p.y += (dyMouse / distMouse) * force * 0.6;
                        }
                    }

                    const currentAlpha = p.alpha + Math.sin(tick * p.pulseSpeed + p.pulsePhase) * 0.12;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.colorPrefix + Math.max(0.1, currentAlpha).toFixed(2) + ')';
                    ctx.fill();

                    // Connect nearby nodes
                    for (let j = i + 1; j < networkNodes.length; j++) {
                        const p2 = networkNodes[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 125;

                        if (dist < maxDist) {
                            const isLight = currentThemeMode === 'light';
                            const lineAlpha = (1 - dist / maxDist) * (isLight ? 0.22 : 0.14);
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = isLight 
                                ? `rgba(2, 132, 199, ${lineAlpha.toFixed(3)})`
                                : `rgba(6, 182, 212, ${lineAlpha.toFixed(3)})`;
                            ctx.lineWidth = 0.85;
                            ctx.stroke();
                        }
                    }
                }

                papersBgAnimId = requestAnimationFrame(animate);
            }

            if (papersBgAnimId) cancelAnimationFrame(papersBgAnimId);
            animate();
        }

        window.onload = function() {
            setThemeMode(currentThemeMode);
            loadAndIncrementVisitCounter();
            renderScreen();
            initPapersHubBackground();
        };
    </script>
</body>
