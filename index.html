        function renderTermSection(selectedYr, subjectName, categoryType, termName) {

                { key: 'Central Province', label: 'Central Province' },
                { key: 'Southern Province', label: 'Southern Province' },

                { key: 'Northern Province', label: 'Northern Province' },
                { key: 'Uva Province', label: 'Uva Province' },
                { key: 'Mathugama Zone', label: 'Mathugama Education Zone' }
            ] : [
                { key: 'Royal College Colombo', label: 'Royal College | Colombo 07' },
                { key: 'Royal College', label: 'Royal College | Colombo' },
                { key: 'Nalanda College', label: 'Nalanda College | Colombo' },
                { key: 'Visakha Vidyalaya', label: 'Visakha Vidyalaya | Colombo 05' },
                { key: 'Bandaranayake College Gampaha', label: 'Bandaranayake College | Gampaha' },
                { key: 'Richmond College Galle', label: 'Richmond College | Galle' },
                { key: 'Jaffna Hindu College', label: 'Jaffna Hindu College' },
                { key: 'Monaragala Royal College', label: 'Monaragala Royal College' },
                { key: 'Mathugama Zone', label: 'Mathugama Education Zone' },
                { key: 'North Western Province', label: 'North Western Province' }
            ];

            const renderedKeys = new Set();

            knownEntities.forEach(ent => {
                const fullKey = `${selectedYr}_${subjectName}_${categoryType}_${termName}_${ent.key}`;
                if (paperLinks[fullKey]) {
                    buttonsHTML += renderPaperButton(fullKey, ent.label, 'download');
                    renderedKeys.add(fullKey);
                }
            });

            const prefix = `${selectedYr}_${subjectName}_${categoryType}_${termName}_`;
            Object.keys(paperLinks).forEach(pk => {
                if (pk.startsWith(prefix) && !renderedKeys.has(pk)) {
                    const customName = pk.substring(prefix.length);
                    buttonsHTML += renderPaperButton(pk, customName, 'download');
                    renderedKeys.add(pk);
                }
            });

            if (!buttonsHTML.trim()) {
                return '';
            }

            return `
                <div class="space-y-1.5 pl-2 border-l-2 border-cyan-500/30 my-2">
                    <h4 class="text-[11px] font-bold text-cyan-300 uppercase tracking-wide">${termName}</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${buttonsHTML}
                    </div>
                </div>
            `;
        }

            `).join('');

            return `
                <div class="text-center space-y-5">
                    <div>
                        <h2 class="text-xl font-bold text-white">O/L ප්‍රධාන විෂයන් තෝරන්න</h2>
                        <span class="inline-block mt-1.5 px-3 py-1 bg-teal-500/10 text-teal-400 border border-teal-500/20 text-xs rounded-full font-medium">
                            සාමාන්‍ය පෙළ (O/L Subjects)
                        </span>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 pt-2">
                        ${subjectsHTML}
                    </div>

                    ${renderNavigationButtons()}
                </div>
            `;
        }

        function renderALSubjects() {
            const streamKey = currentStateData.stream || 'Science';
            const streamTitle = currentStateData.streamTitle || 'විද්‍යාව (Science)';
            const subjectList = alStreamSubjects[streamKey] || alStreamSubjects['Science'];

            const listHTML = subjectList.map(subj => `
                <button onclick="selectSubject('${subj.id}', 'YEAR_SELECTION')" class="w-full py-3.5 px-4 bg-slate-800/60 hover:bg-slate-800 hover:border-cyan-500/50 text-slate-200 hover:text-white font-medium text-sm rounded-xl border border-slate-700/60 transition-all active:scale-[0.98] text-left flex items-center justify-between group">
                    <span class="group-hover:text-cyan-300 transition-colors">${subj.name}</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 text-slate-500 group-hover:text-cyan-400 group-hover:translate-x-1 transition-all"></i>
                </button>
            `).join('');

            return `
                <div class="text-center space-y-5">
                    <div>
                        <h2 class="text-xl font-bold text-white">A/L ප්‍රධාන විෂයන් තෝරන්න</h2>
                        <span class="inline-block mt-1.5 px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-xs rounded-full font-medium">
                            ${streamTitle} - ප්‍රධාන විෂයන්
                        </span>
                    </div>

                    <div class="space-y-2 pt-2">
                        ${listHTML}
                    </div>

                    ${renderNavigationButtons()}
                </div>
            `;
        }

        function renderYearSelection() {
            const subjectName = currentStateData.subject || "Physics";
            
            let yearsGridHTML = years.map(yr => {
                return `
                    <button onclick="selectYear('${yr}')" 
                        class="py-2.5 px-2 bg-slate-800/60 hover:bg-slate-800 hover:border-cyan-500/50 text-slate-300 hover:text-white font-semibold text-xs sm:text-sm rounded-xl border border-slate-700/60 transition-all active:scale-[0.96]">
                        ${yr}
                    </button>
                `;
            }).join('');

            return `
                <div class="text-center space-y-5">
                    <div>
                        <h2 class="text-xl font-bold text-cyan-400">${subjectName}</h2>
                        <p class="text-sm font-semibold text-slate-200 mt-1">අවුරුද්ද තෝරන්න</p>
                        <p class="text-xs text-slate-400 mt-0.5">ඔබට අවශ්‍ය වර්ෂය මත Click කරන්න</p>
                    </div>

                    <div class="grid grid-cols-4 gap-2 pt-2">
                        ${yearsGridHTML}
                    </div>

                    ${renderNavigationButtons()}
                </div>
            `;
        }

        function renderPaperDetails() {
            const subjectName = currentStateData.subject || "Physics";
            const selectedYr = currentStateData.selectedYear || "2023";

            let yearsGridHTML = years.map(yr => {
                const isSelected = yr === selectedYr;
                const activeClasses = isSelected 
                    ? "bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-md shadow-cyan-500/20 font-bold border-cyan-400" 
                    : "bg-slate-800/60 hover:bg-slate-800 text-slate-300 hover:text-white font-medium border-slate-700/60";

                return `
                    <button onclick="selectYear('${yr}')" 
                        class="py-2.5 px-2 text-xs sm:text-sm rounded-xl border transition-all ${activeClasses}">
                        ${yr}
                    </button>
                `;
            }).join('');

            const prov1st = renderTermSection(selectedYr, subjectName, 'Provincial', '1st Term');
            const prov2nd = renderTermSection(selectedYr, subjectName, 'Provincial', '2nd Term');
            const prov3rd = renderTermSection(selectedYr, subjectName, 'Provincial', '3rd Term');
            const provincialHTML = prov1st + prov2nd + prov3rd;

            const school1st = renderTermSection(selectedYr, subjectName, 'School', '1st Term');
            const school2nd = renderTermSection(selectedYr, subjectName, 'School', '2nd Term');
            const school3rd = renderTermSection(selectedYr, subjectName, 'School', '3rd Term');
            const schoolHTML = school1st + school2nd + school3rd;

            const mcqBtn = renderPaperButton(`${selectedYr}_${subjectName}_MCQ Paper`, 'MCQ Paper Download', 'download', 'grid');
            const essayBtn = renderPaperButton(`${selectedYr}_${subjectName}_Essay Paper`, 'Essay Paper Download', 'download', 'grid');
            const markingBtn = renderPaperButton(`${selectedYr}_${subjectName}_Marking Scheme`, 'Marking Scheme Download', 'file-check', 'teal');

            return `
                <div class="text-center space-y-5">
                    <div>
                        <h2 class="text-xl font-bold text-cyan-400">${subjectName}</h2>
                        <p class="text-sm font-semibold text-slate-200 mt-1">අවුරුද්ද තෝරන්න</p>
                        <p class="text-xs text-slate-400 mt-0.5">ඔබට අවශ්‍ය වර්ෂය මත Click කරන්න</p>
                    </div>

                    <div class="grid grid-cols-4 gap-2 pt-1">
                        ${yearsGridHTML}
                    </div>

                    <div class="space-y-4 pt-3 text-left border-t border-slate-800/80">
                        
                        ${(mcqBtn || essayBtn || markingBtn) ? `
                        <div class="space-y-2">
                            <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="file-text" class="w-3.5 h-3.5 text-cyan-400"></i>
                                ${selectedYr} Past Paper & Scheme
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${mcqBtn}
                                ${essayBtn}
                            </div>
                            ${markingBtn}
                        </div>
                        ` : ''}

                        ${provincialHTML ? `
                        <div class="space-y-2 pt-1">
                            <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-cyan-400"></i>
                                ${selectedYr} Provincial Term Test Papers
                            </h3>
                            ${provincialHTML}
                        </div>
                        ` : ''}

                        ${schoolHTML ? `
                        <div class="space-y-2 pt-1">
                            <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="graduation-cap" class="w-3.5 h-3.5 text-cyan-400"></i>
                                ${selectedYr} School Term Test Papers
                            </h3>
                            ${schoolHTML}
                        </div>
                        ` : ''}

                    </div>

                    ${renderNavigationButtons()}
                </div>
            `;
        }

        function renderNavigationButtons() {
            return `
                <div class="pt-4 flex items-center justify-center gap-4 text-xs text-slate-400 border-t border-slate-800/60 mt-4">
                    <button onclick="goBack()" class="hover:text-cyan-400 flex items-center gap-1 font-medium transition-colors py-1 px-2 rounded-lg hover:bg-slate-800/50">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> පෙර පිටුවට (Back)
                    </button>
                    <span class="text-slate-700">|</span>
                    <button onclick="goHome()" class="hover:text-cyan-400 flex items-center gap-1 font-medium transition-colors py-1 px-2 rounded-lg hover:bg-slate-800/50">
                        <i data-lucide="home" class="w-3.5 h-3.5"></i> මුල් පිටුවට (Home)
                    </button>
                </div>
            `;
        }

        function navigateTo(step) {
            stateHistory.push(step);
            renderScreen();
        }

        function goBack() {
            if (stateHistory.length > 1) {
                stateHistory.pop();
                renderScreen();
            }
        }

        function goHome() {
            stateHistory = ['HOME'];
            currentStateData = { exam: null, stream: null, streamTitle: '', subject: null, selectedYear: null };
            renderScreen();
        }

        function selectALStream(streamKey, streamTitle) {
            currentStateData.stream = streamKey;
            currentStateData.streamTitle = streamTitle;
            navigateTo('AL_SUBJECTS');
        }

        function selectSubject(subjName, nextStep) {
            currentStateData.subject = subjName;
            navigateTo(nextStep);
        }

        function selectYear(yr) {
            currentStateData.selectedYear = yr;
            if (stateHistory[stateHistory.length - 1] !== 'PAPER_DETAILS') {
                navigateTo('PAPER_DETAILS');
            } else {
                renderScreen();
            }
        }

        let currentTargetDownloadLink = '';
        let adCountdownTimer = null;

        function downloadPaper(paperKey) {
            const link = paperLinks[paperKey];
            if (link && link.trim() !== "" && !link.includes("YOUR_")) {
                currentTargetDownloadLink = link;
                triggerAdvertisementModal();
            } else {
                showToast(`අදාළ Link එක තවම ඇතුළත් කර නැත!`);
            }
        }

        // Shorts ඇතුළු සියලුම YouTube URL වලින් Video ID එක නිවැරදිව ලබා ගැනීමට යාවත්කාලීන කළ Function එක
        function extractYouTubeID(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function triggerAdvertisementModal() {
            const overlay = document.getElementById('ad-modal-overlay');
            if (!overlay) return;

            let selectedAdLink = '';
            if (advertisementLinks && advertisementLinks.length > 0) {
                const randomIndex = Math.floor(Math.random() * advertisementLinks.length);
                selectedAdLink = advertisementLinks[randomIndex];
            }

            const videoId = extractYouTubeID(selectedAdLink);
            const isImagePost = !videoId && (selectedAdLink.endsWith('.jpg') || selectedAdLink.endsWith('.png') || selectedAdLink.endsWith('.webp') || selectedAdLink.includes('ggpht.com'));

            let mediaHTML = '';

            if (videoId) {
                // Error 153 විසඳීමට referrerpolicy="strict-origin-when-cross-origin" එකතු කරන ලදී
                mediaHTML = `
                    <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black shadow-lg">
                        <iframe 
                            src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&disablekb=1" 
                            title="Advertisement" 
                            class="w-full h-full border-0 pointer-events-none scale-[1.05]"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                `;
            } else if (isImagePost) {
                mediaHTML = `
                    <div class="w-full rounded-xl overflow-hidden bg-slate-900 border border-slate-700/50 flex items-center justify-center max-h-[350px]">
                        <img src="${selectedAdLink}" alt="Advertisement" class="w-full h-full object-contain" />
                    </div>
                `;
            } else {
                mediaHTML = `
                    <div class="w-full p-8 rounded-xl bg-slate-800/80 border border-slate-700/60 text-center">
                        <i data-lucide="sparkles" class="w-10 h-10 text-cyan-400 mx-auto mb-3 animate-pulse"></i>
                        <p class="text-sm font-semibold text-slate-200">NGP6 Official Sponsor Announcement</p>
                        <p class="text-xs text-slate-400 mt-1">ඔබගේ Download Link එක සුදානම් වෙමින් පවතී...</p>
                    </div>
                `;
            }

            overlay.innerHTML = `
                <div class="ad-modal-anim w-full max-w-md bg-slate-900 border border-cyan-500/30 rounded-2xl p-4 sm:p-5 shadow-2xl flex flex-col gap-4 relative">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-[10px] font-bold uppercase tracking-wider">Ad</span>
                            <span class="text-xs font-semibold text-slate-300">Sponsor Advertisement</span>
                        </div>
                        <span id="ad-timer-text" class="text-xs text-slate-400 font-medium">Skip in <b id="ad-countdown" class="text-cyan-400">5</b>s</span>
                    </div>

                    ${mediaHTML}

                    <div class="pt-1 flex items-center justify-end">
                        <button id="skip-ad-btn" disabled onclick="skipAdAndDownload()" 
                            class="py-2.5 px-5 bg-slate-800 text-slate-500 font-semibold text-xs rounded-xl border border-slate-700 cursor-not-allowed transition-all flex items-center gap-2">
                            <span>Skip Ad</span>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;

            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            if (window.lucide) lucide.createIcons();

            let timeLeft = 5;
            if (adCountdownTimer) clearInterval(adCountdownTimer);

            adCountdownTimer = setInterval(() => {
                timeLeft--;
                const countdownElem = document.getElementById('ad-countdown');
                if (countdownElem) countdownElem.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(adCountdownTimer);
                    const skipBtn = document.getElementById('skip-ad-btn');
                    const timerText = document.getElementById('ad-timer-text');
                    
                    if (skipBtn) {
                        skipBtn.disabled = false;
                        skipBtn.className = "py-2.5 px-5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/25 cursor-pointer transition-all flex items-center gap-2 active:scale-95 animate-bounce";
                    }
                    if (timerText) {
                        timerText.innerHTML = `<span class="text-cyan-400 font-semibold">You can skip now</span>`;
                    }
                }
            }, 1000);
        }

        function skipAdAndDownload() {
            const overlay = document.getElementById('ad-modal-overlay');
            if (overlay) {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                overlay.innerHTML = ``;
            }

            if (adCountdownTimer) clearInterval(adCountdownTimer);

            if (currentTargetDownloadLink) {
                window.open(currentTargetDownloadLink, '_blank');
                currentTargetDownloadLink = '';
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-cyan-500/40 text-slate-100 text-xs sm:text-sm py-3 px-5 rounded-2xl shadow-2xl shadow-cyan-950/80 z-50 transition-all duration-300 transform opacity-0 translate-y-3 flex items-center gap-2.5 backdrop-blur-md';
            toast.innerHTML = `<i data-lucide="info" class="w-4 h-4 text-cyan-400"></i> <span class="font-medium">${message}</span>`;
            
            document.body.appendChild(toast);
            if (window.lucide) lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-3');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-3');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        window.onload = function() {
            renderScreen();
        };
    </script>
</body>
</html>
