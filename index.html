        function renderGradeTermSection(selectedYr, subjectName, gradeLevel, categoryType, termName) {
            let buttonsHTML = '';

            const knownEntities = categoryType === 'Provincial' ? [

                { key: 'Central Province', label: 'Central Province' },
                { key: 'Southern Province', label: 'Southern Province' },

                { key: 'Eastern Province', label: 'Eastern Province' },
                { key: 'Northern Province', label: 'Northern Province' },
                { key: 'Uva Province', label: 'Uva Province' },
                { key: 'Mathugama Zone', label: 'Mathugama Education Zone' }
            ] : [
                { key: 'Royal College Colombo', label: 'Royal College | Colombo 07' },
                { key: 'Royal College', label: 'Royal College | Colombo' },
                { key: 'Nalanda College', label: 'Nalanda College | Colombo' },
                { key: 'Visakha Vidyalaya', label: 'Visakha Vidyalaya | Colombo 05' },
                { key: 'Bandaranayake College Gampaha', label: 'Bandaranayake College | Gampaha' },
                { key: 'Richmond College Galle', label: 'Richmond College | Galle' },
                { key: 'Jaffna Hindu College', label: 'Jaffna Hindu College' },
                { key: 'Monaragala Royal College', label: 'Monaragala Royal College' },
                { key: 'Mathugama Zone', label: 'Mathugama Education Zone' },
                { key: 'North Western Province', label: 'North Western Province' }
            ];

            const renderedKeys = new Set();

            if (gradeLevel) {
                knownEntities.forEach(ent => {
                    const fullKey = `${selectedYr}_${subjectName}_${gradeLevel}_${categoryType}_${termName}_${ent.key}`;
                    if (paperLinks[fullKey]) {
                        buttonsHTML += renderPaperButton(fullKey, ent.label, 'download');
                        renderedKeys.add(fullKey);
                    }
                });

                const prefix = `${selectedYr}_${subjectName}_${gradeLevel}_${categoryType}_${termName}_`;
                Object.keys(paperLinks).forEach(pk => {
                    if (pk.startsWith(prefix) && !renderedKeys.has(pk)) {
                        const customName = pk.substring(prefix.length);
                        buttonsHTML += renderPaperButton(pk, customName, 'download');
                        renderedKeys.add(pk);
                    }
                });
            }

            if (gradeLevel === 'Grade 11' && !buttonsHTML.trim()) {
                knownEntities.forEach(ent => {
                    const legacyKey = `${selectedYr}_${subjectName}_${categoryType}_${termName}_${ent.key}`;
                    if (paperLinks[legacyKey]) {
                        buttonsHTML += renderPaperButton(legacyKey, ent.label, 'download');
                        renderedKeys.add(legacyKey);
                    }
                });

                const legacyPrefix = `${selectedYr}_${subjectName}_${categoryType}_${termName}_`;
                Object.keys(paperLinks).forEach(pk => {
                    if (pk.startsWith(legacyPrefix) && !pk.includes('_Grade ') && !renderedKeys.has(pk)) {
                        const customName = pk.substring(legacyPrefix.length);
                        buttonsHTML += renderPaperButton(pk, customName, 'download');
                        renderedKeys.add(pk);
                    }
                });
            }

            if (!buttonsHTML.trim()) {
                return '';
            }

            return `
                <div class="space-y-1.5 pl-2 border-l-2 border-cyan-500/30 my-2">
                    <h4 class="text-[11px] font-bold text-cyan-300 uppercase tracking-wide">${termName}</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${buttonsHTML}
                    </div>
                </div>
            `;
        }

                const isSelected = yr === selectedYr;
                const activeClasses = isSelected 
                    ? "bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-md shadow-cyan-500/20 font-bold border-cyan-400" 
                    : "bg-slate-800/60 hover:bg-slate-800 text-slate-300 hover:text-white font-medium border-slate-700/60";

                return `
                    <button onclick="selectYear('${yr}')" 
                        class="py-2.5 px-2 text-xs sm:text-sm rounded-xl border transition-all ${activeClasses}">
                        ${yr}
                    </button>
                `;
            }).join('');

            const mcqBtn = renderPaperButton(`${selectedYr}_${subjectName}_MCQ Paper`, 'MCQ Paper Download', 'download', 'grid');
            const essayBtn = renderPaperButton(`${selectedYr}_${subjectName}_Essay Paper`, 'Essay Paper Download', 'download', 'grid');
            const markingBtn = renderPaperButton(`${selectedYr}_${subjectName}_Marking Scheme`, 'Marking Scheme Download', 'file-check', 'teal');

            let papersSectionHTML = '';

            if (isAL) {
                const activeTab = currentStateData.alTab || 'GRADE_12';
                const isGrade12 = activeTab === 'GRADE_12';
                const gradeKey = isGrade12 ? 'Grade 12' : 'Grade 13';

                const prov1st = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'Provincial', '1st Term');
                const prov2nd = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'Provincial', '2nd Term');
                const prov3rd = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'Provincial', '3rd Term');
                const provincialHTML = prov1st + prov2nd + prov3rd;

                const school1st = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'School', '1st Term');
                const school2nd = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'School', '2nd Term');
                const school3rd = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'School', '3rd Term');
                const schoolHTML = school1st + school2nd + school3rd;

                let tabContentHTML = `
                    <div class="space-y-4 pt-2 text-left">
                        ${provincialHTML ? `
                        <div class="space-y-2">
                            <h4 class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-cyan-400"></i> ${gradeKey} Provincial Term Papers
                            </h4>
                            ${provincialHTML}
                        </div>` : ''}

                        ${schoolHTML ? `
                        <div class="space-y-2 pt-1">
                            <h4 class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="graduation-cap" class="w-3.5 h-3.5 text-cyan-400"></i> ${gradeKey} School Term Papers
                            </h4>
                            ${schoolHTML}
                        </div>` : ''}

                        ${!provincialHTML && !schoolHTML ? `<p class="text-xs text-slate-500 text-center py-4">No papers found for ${gradeKey} in ${selectedYr}.</p>` : ''}
                    </div>
                `;

                papersSectionHTML = `
                    <div class="space-y-3 pt-2 border-t border-slate-800/80">
                        <div class="flex rounded-xl bg-slate-900/80 p-1 border border-slate-800">
                            <button onclick="switchALTab('GRADE_12')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${isGrade12 ? 'bg-cyan-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}">
                                Grade 12 Papers
                            </button>
                            <button onclick="switchALTab('GRADE_13')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${!isGrade12 ? 'bg-cyan-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}">
                                Grade 13 Papers
                            </button>
                        </div>
                        <div class="mt-2">
                            ${tabContentHTML}
                        </div>
                    </div>
                `;
            } else {
                const activeTab = currentStateData.olTab || 'GRADE_11';
                const isGrade10 = activeTab === 'GRADE_10';
                const gradeKey = isGrade10 ? 'Grade 10' : 'Grade 11';

                const prov1st = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'Provincial', '1st Term');
                const prov2nd = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'Provincial', '2nd Term');
                const prov3rd = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'Provincial', '3rd Term');
                const provincialHTML = prov1st + prov2nd + prov3rd;

                const school1st = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'School', '1st Term');
                const school2nd = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'School', '2nd Term');
                const school3rd = renderGradeTermSection(selectedYr, subjectName, gradeKey, 'School', '3rd Term');
                const schoolHTML = school1st + school2nd + school3rd;

                let tabContentHTML = `
                    <div class="space-y-4 pt-2 text-left">
                        ${provincialHTML ? `
                        <div class="space-y-2">
                            <h4 class="text-xs font-bold text-teal-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-teal-400"></i> ${gradeKey} Provincial Term Papers
                            </h4>
                            ${provincialHTML}
                        </div>` : ''}

                        ${schoolHTML ? `
                        <div class="space-y-2 pt-1">
                            <h4 class="text-xs font-bold text-teal-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i data-lucide="graduation-cap" class="w-3.5 h-3.5 text-teal-400"></i> ${gradeKey} School Term Papers
                            </h4>
                            ${schoolHTML}
                        </div>` : ''}

                        ${!provincialHTML && !schoolHTML ? `<p class="text-xs text-slate-500 text-center py-4">No papers found for ${gradeKey} in ${selectedYr}.</p>` : ''}
                    </div>
                `;

                papersSectionHTML = `
                    <div class="space-y-3 pt-2 border-t border-slate-800/80">
                        <div class="flex rounded-xl bg-slate-900/80 p-1 border border-slate-800">
                            <button onclick="switchOLTab('GRADE_10')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${isGrade10 ? 'bg-teal-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}">
                                Grade 10 Papers
                            </button>
                            <button onclick="switchOLTab('GRADE_11')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${!isGrade10 ? 'bg-teal-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}">
                                Grade 11 Papers
                            </button>
                        </div>
                        <div class="mt-2">
                            ${tabContentHTML}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="text-center space-y-5">
                    <div>
                        <h2 class="text-xl font-bold ${isAL ? 'text-cyan-400' : 'text-teal-400'}">${subjectName}</h2>
                        <p class="text-sm font-semibold text-slate-200 mt-1">අවුරුද්ද තෝරන්න</p>
                        <p class="text-xs text-slate-400 mt-0.5">ඔබට අවශ්‍ය වර්ෂය මත Click කරන්න</p>
                    </div>

                    <div class="grid grid-cols-4 gap-2 pt-1">
                        ${yearsGridHTML}
                    </div>

                    ${(mcqBtn || essayBtn || markingBtn) ? `
                    <div class="space-y-2 pt-3 border-t border-slate-800/80 text-left">
                        <h3 class="text-xs font-bold ${isAL ? 'text-cyan-400' : 'text-teal-400'} uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="file-text" class="w-3.5 h-3.5 ${isAL ? 'text-cyan-400' : 'text-teal-400'}"></i>
                            ${selectedYr} Past Paper & Scheme
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${mcqBtn}
                            ${essayBtn}
                        </div>
                        ${markingBtn}
                    </div>
                    ` : ''}

                    ${papersSectionHTML}

                    ${renderNavigationButtons()}
                </div>
            `;
        }

        function renderNavigationButtons() {
            return `
                <div class="pt-4 flex items-center justify-center gap-4 text-xs text-slate-400 border-t border-slate-800/60 mt-4">
                    <button onclick="goBack()" class="hover:text-cyan-400 flex items-center gap-1 font-medium transition-colors py-1 px-2 rounded-lg hover:bg-slate-800/50">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> පෙර පිටුවට (Back)
                    </button>
                    <span class="text-slate-700">|</span>
                    <button onclick="goHome()" class="hover:text-cyan-400 flex items-center gap-1 font-medium transition-colors py-1 px-2 rounded-lg hover:bg-slate-800/50">
                        <i data-lucide="home" class="w-3.5 h-3.5"></i> මුල් පිටුවට (Home)
                    </button>
                </div>
            `;
        }

        function navigateTo(step) {
            stateHistory.push(step);
            renderScreen();
        }

        function goBack() {
            if (stateHistory.length > 1) {
                stateHistory.pop();
                renderScreen();
            }
        }

        function goHome() {
            stateHistory = ['HOME'];
            currentStateData = { exam: null, stream: null, streamTitle: '', subject: null, selectedYear: null, alTab: 'GRADE_12', olTab: 'GRADE_11' };
            renderScreen();
        }

        function selectALStream(streamKey, streamTitle) {
            currentStateData.stream = streamKey;
            currentStateData.streamTitle = streamTitle;
            navigateTo('AL_SUBJECTS');
        }

        function selectSubject(subjName, nextStep) {
            currentStateData.subject = subjName;
            navigateTo(nextStep);
        }

        function selectYear(yr) {
            currentStateData.selectedYear = yr;
            if (stateHistory[stateHistory.length - 1] !== 'PAPER_DETAILS') {
                navigateTo('PAPER_DETAILS');
            } else {
                renderScreen();
            }
        }

        let currentTargetDownloadLink = '';
        let adCountdownTimer = null;
        let currentActiveAd = null;

        function downloadPaper(paperKey) {
            const link = paperLinks[paperKey];
            if (link && link.trim() !== "" && !link.includes("YOUR_")) {
                currentTargetDownloadLink = link;
                triggerAdvertisementModal();
            } else {
                showToast(`අදාළ Link එක තවම ඇතුළත් කර නැත!`);
            }
        }

        function extractYouTubeID(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function triggerAdvertisementModal() {
            const overlay = document.getElementById('ad-modal-overlay');
            if (!overlay) return;

            // දැනට තෝරාගෙන ඇති විෂය (උදා: Physics, Political Science ආදී වශයෙන්) ලබා ගැනීම
            const currentSubject = currentStateData.subject || 'default';
            
            // අදාළ විෂයට අදාළ දැන්වීම් ලැයිස්තුව ලබා ගැනීම, නැතහොත් 'default' ලැයිස්තුව පෙන්වීම
            let adsList = subjectAdvertisements[currentSubject] || subjectAdvertisements['default'];

            let selectedAd = {
                videoUrl: 'https://www.youtube.com/watch?v=PIrLGBgoz2U',
                youtubeChannelUrl: 'https://www.youtube.com/@NGP6Official',
                whatsappNumber: ''
            };

            if (adsList && adsList.length > 0) {
                const randomIndex = Math.floor(Math.random() * adsList.length);
                selectedAd = adsList[randomIndex];
            }

            currentActiveAd = selectedAd;

            const videoId = extractYouTubeID(selectedAd.videoUrl);
            const isShorts = selectedAd.videoUrl && selectedAd.videoUrl.includes('/shorts/');
            
            let mediaHTML = '';

            if (videoId) {
                const playerContainerClass = isShorts 
                    ? "relative w-full max-w-[240px] mx-auto aspect-[9/16] rounded-xl overflow-hidden bg-black shadow-lg" 
                    : "relative w-full aspect-video rounded-xl overflow-hidden bg-black shadow-lg";

                mediaHTML = `
                    <div class="${playerContainerClass}">
                        <iframe 
                            src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&disablekb=1" 
                            title="Advertisement" 
                            class="w-full h-full border-0 pointer-events-none scale-[1.05]"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                `;
            } else {
                mediaHTML = `
                    <div class="w-full p-8 rounded-xl bg-slate-800/80 border border-slate-700/60 text-center">
                        <i data-lucide="sparkles" class="w-10 h-10 text-cyan-400 mx-auto mb-3 animate-pulse"></i>
                        <p class="text-sm font-semibold text-slate-200">NGP6 Official Sponsor Announcement</p>
                        <p class="text-xs text-slate-400 mt-1">ඔබගේ Download Link එක සුදානම් වෙමින් පවතී...</p>
                    </div>
                `;
            }

            let whatsappButtonHTML = '';
            if (selectedAd.whatsappNumber && selectedAd.whatsappNumber.trim() !== '') {
                whatsappButtonHTML = `
                    <a href="https://wa.me/${selectedAd.whatsappNumber}" target="_blank" 
                        class="py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-xl shadow-md shadow-emerald-900/30 transition-all flex items-center justify-center gap-1.5 active:scale-95 border border-emerald-500/30">
                        <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp
                    </a>
                `;
            }

            let youtubeButtonHTML = '';
            if (selectedAd.youtubeChannelUrl && selectedAd.youtubeChannelUrl.trim() !== '') {
                youtubeButtonHTML = `
                    <a href="${selectedAd.youtubeChannelUrl}" target="_blank" 
                        class="py-2.5 px-4 bg-red-600 hover:bg-red-500 text-white font-semibold text-xs rounded-xl shadow-md shadow-red-900/30 transition-all flex items-center justify-center gap-1.5 active:scale-95 border border-red-500/30 flex-1">
                        <i data-lucide="youtube" class="w-4 h-4"></i> YouTube Channel
                    </a>
                `;
            }

            overlay.innerHTML = `
                <div class="ad-modal-anim w-full max-w-md bg-slate-900 border border-cyan-500/30 rounded-2xl p-4 sm:p-5 shadow-2xl flex flex-col gap-3 relative">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-[10px] font-bold uppercase tracking-wider">Ad</span>
                            <span class="text-xs font-semibold text-slate-300">Sponsor Advertisement</span>
                        </div>
                        <span id="ad-timer-text" class="text-xs text-slate-400 font-medium">Skip in <b id="ad-countdown" class="text-cyan-400">5</b>s</span>
                    </div>

                    ${mediaHTML}

                    <div class="space-y-2 pt-1 border-t border-slate-800/80">
                        <p class="text-[11px] font-medium text-slate-400 text-center">මේ පිලිබඳ වැඩිදුර තොරතුරු සහ විමසීම් සඳහා,</p>
                        <div class="flex items-center gap-2">
                            ${youtubeButtonHTML}
                            ${whatsappButtonHTML}
                        </div>
                    </div>

                    <div class="pt-1 flex items-center justify-end border-t border-slate-800/80">
                        <button id="skip-ad-btn" disabled onclick="skipAdAndDownload()" 
                            class="py-2 px-4 bg-slate-800 text-slate-500 font-semibold text-xs rounded-xl border border-slate-700 cursor-not-allowed transition-all flex items-center gap-2">
                            <span>Skip Ad</span>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;

            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            if (window.lucide) lucide.createIcons();

            let timeLeft = 5;
            if (adCountdownTimer) clearInterval(adCountdownTimer);

            adCountdownTimer = setInterval(() => {
                timeLeft--;
                const countdownElem = document.getElementById('ad-countdown');
                if (countdownElem) countdownElem.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(adCountdownTimer);
                    const skipBtn = document.getElementById('skip-ad-btn');
                    const timerText = document.getElementById('ad-timer-text');
                    
                    if (skipBtn) {
                        skipBtn.disabled = false;
                        skipBtn.className = "py-2 px-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/25 cursor-pointer transition-all flex items-center gap-2 active:scale-95 animate-bounce";
                    }
                    if (timerText) {
                        timerText.innerHTML = `<span class="text-cyan-400 font-semibold">You can skip now</span>`;
                    }
                }
            }, 1000);
        }

        function skipAdAndDownload() {
            const overlay = document.getElementById('ad-modal-overlay');
            if (overlay) {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                overlay.innerHTML = ``;
            }

            if (adCountdownTimer) clearInterval(adCountdownTimer);

            if (currentTargetDownloadLink) {
                window.open(currentTargetDownloadLink, '_blank');
                currentTargetDownloadLink = '';
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-cyan-500/40 text-slate-100 text-xs sm:text-sm py-3 px-5 rounded-2xl shadow-2xl shadow-cyan-950/80 z-50 transition-all duration-300 transform opacity-0 translate-y-3 flex items-center gap-2.5 backdrop-blur-md';
            toast.innerHTML = `<i data-lucide="info" class="w-4 h-4 text-cyan-400"></i> <span class="font-medium">${message}</span>`;
            
            document.body.appendChild(toast);
            if (window.lucide) lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-3');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-3');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        window.onload = function() {
            renderScreen();
        };
    </script>
</body>
</html>
